<!DOCTYPE html>
<html>

<head>
<title>Chatbot</title>
</head>

<body>

<h2>AI Chatbot</h2>

<input
type="text"
id="message">

<button onclick="sendMessage()">
Send
</button>

<p id="response"></p>

<script>

function sendMessage(){

let msg =
document.getElementById("message").value;

fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:msg
})

})

.then(
response=>response.json()
)

.then(data=>{

document.getElementById(
"response"
).innerHTML=data.response;

});

}

</script>

</body>

</html>
